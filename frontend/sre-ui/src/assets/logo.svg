  <line x1="100" y1="95" x2="100" y2="60" stroke="#90a4ae" stroke-width="2.5"/>
  <ellipse cx="100" cy="60" rx="3" ry="3" fill="#78909c"/>
  <!-- Aspas -->
  <path d="M100 60 Q108 48 103 43 Q97 52 100 60Z" fill="#b0bec5"/>
  <path d="M100 60 Q88 56 86 62 Q96 64 100 60Z" fill="#b0bec5"/>
  <path d="M100 60 Q104 72 110 70 Q106 60 100 60Z" fill="#b0bec5"/>

