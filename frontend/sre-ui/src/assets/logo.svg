  <line x1="88" y1="43" x2="88" y2="46" stroke="#fdd835" stroke-width="2" stroke-linecap="round"/>
  <line x1="73" y1="28" x2="70" y2="28" stroke="#fdd835" stroke-width="2" stroke-linecap="round"/>
  <line x1="103" y1="28" x2="106" y2="28" stroke="#fdd835" stroke-width="2" stroke-linecap="round"/>
  <line x1="77" y1="17" x2="75" y2="15" stroke="#fdd835" stroke-width="2" stroke-linecap="round"/>
  <line x1="99" y1="39" x2="101" y2="41" stroke="#fdd835" stroke-width="2" stroke-linecap="round"/>
  <line x1="99" y1="17" x2="101" y2="15" stroke="#fdd835" stroke-width="2" stroke-linecap="round"/>
  <line x1="77" y1="39" x2="75" y2="41" stroke="#fdd835" stroke-width="2" stroke-linecap="round"/>

