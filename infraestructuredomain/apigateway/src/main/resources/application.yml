server:
  port: 8080
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty,http.client: DEBUG
spring:
  application:
    name: apigateway
  cloud:
    gateway:
      routes:
        - id: customer_services
          uri: lb://CUSTOMER
          predicates:
            - Path=/**
          filters: 
            - AuthenticationFilterinig
            #name: AuthenticationFilterinig
          